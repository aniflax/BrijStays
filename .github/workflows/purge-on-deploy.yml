name: Purge Cloudflare cache on push

on:
  push:
    branches: [main]

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Purge Cloudflare zone cache
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_ZONE: ${{ secrets.CF_ZONE }}
        run: |
          if [ -z "$CF_ZONE_ID" ]; then
            : "${CF_ZONE:?set CF_ZONE (domain) or CF_ZONE_ID as a GitHub secret}"
            CF_ZONE_ID=$(curl -fsS -H "Authorization: Bearer ${CF_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/zones?name=${CF_ZONE}" \
              | grep -oE '"id":"[0-9a-f]+"' | head -1 | cut -d'"' -f4)
          fi
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" -H "Content-Type: application/json" \
            -d '{"purge_everything":true}'